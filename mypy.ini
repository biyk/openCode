# Конфиг mypy: поэтапное включение типизации (scripts/check_types.py, AGENTS §3).
# Глобальная «зелёная mypy» не цель: noise от live-интеграций глушится,
# строгость включается зонами — сначала чистая логика.

[mypy]
ignore_missing_imports = True
follow_imports = silent
warn_redundant_casts = True

# Строгая зона: матчер команд (детерминированная логика).
# ВАЖНО: mypy 2.3 матчит секции по точечным именам БЕЗ экранирования \.
[mypy-lib.voice_cmd.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# Ядро — чуть мягче: миксины обращаются к атрибутам, которые задаёт
# Orchestrator (__init__), — attr-defined для них ложный шум.
[mypy-lib.core.*]
check_untyped_defs = True
disable_error_code = attr-defined
